<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Vault - Restricted Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        
        :root {
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.4);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #020617;
            color: #f8fafc;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.1) 0, transparent 50%);
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-glow:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, transparent, rgba(59, 130, 246, 0.2), transparent);
            animation: scan 8s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% { transform: translateY(-100vh); }
            100% { transform: translateY(100vh); }
        }

        .decrypt-bar {
            height: 100%;
            width: 0%;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
            transition: width 0.1s ease-out;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body class="p-6">
    <div class="bg-mesh"></div>
    <div class="scanline"></div>

    <!-- Login Portal -->
    <div id="login-screen" class="w-full max-w-md z-50">
        <div class="glass-card rounded-[2rem] p-10 space-y-8 text-center border-t border-white/20">
            <div class="space-y-4">
                <div class="inline-flex items-center justify-center w-20 h-20 bg-blue-500/10 rounded-2xl border border-blue-500/20 mb-2">
                    <i id="lock-icon" class="fas fa-fingerprint text-3xl text-blue-400"></i>
                </div>
                <h1 class="text-3xl font-black tracking-tighter uppercase">Nexus Vault</h1>
                <p class="text-slate-500 text-[10px] font-bold tracking-[0.4em] uppercase">Authorized Personnel Only</p>
            </div>

            <div id="auth-container" class="space-y-4">
                <div class="relative group input-glow border border-white/5 bg-black/40 rounded-2xl transition-all duration-300">
                    <input type="password" id="vault-pass" placeholder="ENTER ACCESS KEY" 
                           class="w-full bg-transparent py-4 px-6 focus:outline-none text-center text-sm tracking-[0.5em] font-mono text-blue-400 placeholder:text-slate-700">
                </div>
                <button onclick="checkAccess()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl transition-all active:scale-95 text-xs tracking-widest uppercase">
                    Initialize Handshake
                </button>
                <p id="error-msg" class="text-red-500 text-[9px] font-black uppercase tracking-widest hidden">Invalid Security Signature</p>
            </div>

            <!-- Loading UI (Hidden by default) -->
            <div id="loading-ui" class="hidden space-y-6 py-4">
                <div class="text-center space-y-2">
                    <div class="text-blue-400 text-[10px] font-black animate-pulse uppercase tracking-widest">Decrypting Secure Layers...</div>
                </div>
                <div class="h-1 bg-slate-900 rounded-full overflow-hidden">
                    <div id="decrypt-bar" class="decrypt-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Vault (Hidden by default) -->
    <div id="main-vault" class="hidden w-full max-w-6xl py-12 relative">
        <header class="mb-12 text-center space-y-6">
            <div class="inline-flex px-4 py-2 rounded-xl bg-green-500/10 border border-green-500/20 text-green-400 text-[10px] font-black uppercase tracking-widest">
                <span class="w-1.5 h-1.5 bg-green-500 rounded-full mr-2 animate-pulse"></span> Identity Verified
            </div>
            <h2 class="text-5xl font-black tracking-tighter text-white">CENTRAL COMMAND</h2>
            <p class="text-slate-500 text-xs font-bold uppercase tracking-widest">Session Active • All Systems Nominal</p>
        </header>

        <div id="links-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-5">
            <!-- Dynamic Links -->
        </div>

        <div class="mt-20 flex justify-center">
            <button onclick="location.reload()" class="flex flex-col items-center group">
                <div class="w-12 h-12 rounded-full border border-red-500/20 bg-red-500/5 flex items-center justify-center group-hover:bg-red-500 group-hover:text-white transition-all text-red-500">
                    <i class="fas fa-power-off"></i>
                </div>
                <span class="mt-2 text-slate-600 text-[9px] font-black uppercase tracking-widest">Terminate Session</span>
            </button>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 glass-card px-8 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest opacity-0 translate-y-10 transition-all duration-500 pointer-events-none z-[100]">
        Buffer Updated
    </div>

    <script>
        const ACCESS_KEY = "sunomusicchannel";
        
        const RAW_VAULT = [
            { title: "Strategic Command Interface", url: "https://nwoleaks.top/young-paki-threesome-smooching-on-tango-live-show-2/", tags: ["Alpha"] },
            { title: "Financial Ledger Mirror", url: "https://desifakes.com/threads/ai-only-actress-and-celebrities-fakes.35277/page-2", tags: ["Assets"] },
            { title: "Encrypted Comms Hub", url: "https://desifakes.com/threads/ai-only-actress-and-celebrities-fakes.35277/page-2", tags: ["Comms"] },
            { title: "Ghost Identity API", url: "https://aagmaal.to/2023/08/13/millionaires-son-and-daughter-18-arkestra-dance-night-club-viral-video-2023-uncut-mms-porn/", tags: ["API"] },
            { title: "Mainframe Log Stream", url: "https://www.eporner.com/video-lYXKdkv5md1/indian-cousions-bhai-behen-ka-purana-mms-hua-viral/", tags: ["Log"] },
            { title: "Offshore Asset Portal", url: "https://www.eporner.com/video-ecDHStkub8Y/desi-young-slim-school-girl-fucking-viral-mms-clip/", tags: ["Vault"] },
            { title: "Neural Override Gateway", url: "https://www.eporner.com/video-s9AkDcHELAE/perfect-hot-figure-indian-teen-showing-nudes-mms/", tags: ["Secure"] },
            { title: "Jaisalmer Heritage Log", url: "https://www.eporner.com/video-stHsHU2V5Ov/jaisalmer-rajasthan-completely-naked-girl-with-old-man-viral-full-video/", tags: ["Storage"] },
            { title: "Admin Payload Dispatch", url: "https://www.eporner.com/video-87U4JwsVVd7/sexy-desi-cheating-wife-blowjob-and-fucking-with-lover-viral-mms/", tags: ["Root"] },
            { title: "Operational Briefing", url: "https://brief.ops.int/daily", tags: ["Intel"] }
        ];

        function checkAccess() {
            const input = document.getElementById('vault-pass').value;
            const error = document.getElementById('error-msg');
            
            if (input === ACCESS_KEY) {
                startDecryption();
            } else {
                error.classList.remove('hidden');
                document.getElementById('vault-pass').value = '';
                setTimeout(() => error.classList.add('hidden'), 2000);
            }
        }

        // Allow 'Enter' key to submit
        document.getElementById('vault-pass').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAccess();
        });

        function startDecryption() {
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('loading-ui').classList.remove('hidden');
            document.getElementById('lock-icon').className = "fas fa-unlock text-3xl text-green-400 animate-pulse";
            
            let progress = 0;
            const bar = document.getElementById('decrypt-bar');
            
            const interval = setInterval(() => {
                progress += Math.random() * 12;
                if (progress > 100) progress = 100;
                bar.style.width = `${progress}%`;

                if (progress === 100) {
                    clearInterval(interval);
                    setTimeout(showVault, 500);
                }
            }, 80);
        }

        function showVault() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-vault').classList.remove('hidden');
            document.body.style.alignItems = "flex-start";
            
            const container = document.getElementById('links-container');
            RAW_VAULT.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = "glass-card rounded-3xl p-6 flex flex-col justify-between group hover:border-blue-500/30 transition-all duration-500 hover:-translate-y-1";
                div.innerHTML = `
                    <div>
                        <div class="flex gap-2 mb-4">
                            ${item.tags.map(t => `<span class="px-2 py-0.5 rounded-lg bg-blue-500/10 text-[8px] font-black text-blue-400 border border-blue-500/10 uppercase tracking-widest">${t}</span>`).join('')}
                        </div>
                        <h3 class="text-lg font-black text-white mb-2 group-hover:text-blue-400 transition-colors uppercase tracking-tight">${item.title}</h3>
                        <p class="text-[10px] font-mono text-slate-500 break-all line-clamp-1 opacity-60">${item.url}</p>
                    </div>
                    <div class="mt-8 flex items-center justify-between">
                        <span class="text-[9px] font-black text-slate-700 tracking-widest uppercase">NODE 0${i + 1}</span>
                        <div class="flex gap-2">
                            <a href="${item.url}" target="_blank" class="w-10 h-10 rounded-xl bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white flex items-center justify-center transition-all border border-white/5">
                                <i class="fas fa-external-link-alt text-xs"></i>
                            </a>
                            <button onclick="copyLink('${item.url}')" class="w-10 h-10 rounded-xl bg-blue-600/10 hover:bg-blue-600 text-blue-400 hover:text-white flex items-center justify-center transition-all border border-blue-500/10 active:scale-90">
                                <i class="far fa-copy text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function copyLink(text) {
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast();
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            toast.style.transform = 'translate(-50%, -20px)';
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, 10px)';
            }, 2000);
        }
    </script>
</body>
</html>
