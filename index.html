        :root {
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.4);

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;

            color: #f8fafc;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0, transparent 50%),
                radial-gradient(at 100% 0%, rgba(99, 102, 241, 0.12) 0, transparent 50%),
                radial-gradient(at 50% 100%, rgba(30, 64, 175, 0.08) 0, transparent 50%);
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-group:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 1px var(--primary), 0 0 30px var(--primary-glow);
        }

        .shimmer-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .shimmer-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            transition: 0.8s;
        }

        .shimmer-btn:hover::after {
            left: 120%;
        }

        .hidden-vault { display: none; }
        
        .privacy-mask {
            filter: blur(12px) brightness(0.4);
            pointer-events: none;
            user-select: none;
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(1000%); }
        }

        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, transparent, rgba(59, 130, 246, 0.3), transparent);
            animation: scanline 10s linear infinite;
            pointer-events: none;
        }

        .decrypt-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            box-shadow: 0 0 15px var(--primary-glow);
            transition: width 0.15s ease-out;
        }

        .lockout-active {
            filter: grayscale(1) brightness(0.3);
            pointer-events: none;
        }

        .step-transition {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #privacy-overlay {
            z-index: 9999;
            backdrop-filter: blur(40px);
            background: rgba(2, 6, 23, 0.8);
        }
    </style>
</head>

        const p1 = document.getElementById('pass1');

        const unlockBtn = document.getElementById('unlock-btn');
        const statusMsg = document.getElementById('status-msg');

        window.addEventListener('focus', () => {

            document.getElementById('privacy-overlay').style.pointerEvents = 'none';
            if (!isPrivacyMode) {
                document.getElementById('main-vault').classList.remove('privacy-mask');
            }
        });

        function toggleVisibility(id, iconId) {
            const input = document.getElementById(id);
            const icon = document.getElementById(iconId);
            input.type = input.type === "password" ? "text" : "password";
            icon.classList.toggle('fa-eye-slash');
            icon.classList.toggle('fa-eye');
        }

        function togglePrivacy() {
            isPrivacyMode = !isPrivacyMode;
            const stateText = document.getElementById('privacy-state');
            const icon = document.getElementById('privacy-icon');
            
            stateText.innerText = isPrivacyMode ? "ON" : "OFF";
            icon.className = isPrivacyMode ? "fas fa-eye text-blue-400 mr-2" : "fas fa-eye-slash text-blue-400 mr-2";
            
            document.querySelectorAll('.asset-url').forEach(el => {
                isPrivacyMode ? el.classList.add('blur-sm') : el.classList.remove('blur-sm');
            });
            document.getElementById('privacy-toggle').classList.toggle('bg-blue-500/30');
        }

        // Auto-advance Logic
        p1.addEventListener('input', () => {
            if (p1.value === _O.k1) {
                s2Container.classList.remove('opacity-20', 'pointer-events-none');
                document.getElementById('p1-status').innerText = "VERIFIED";
                document.getElementById('p1-status').className = "text-[10px] font-black text-blue-400 tracking-widest";
                p2.focus();
                lockIcon.className = "fas fa-shield-halved text-3xl text-yellow-400";
            }
        });

        // Keyboard Support
        [p1, p2].forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleUnlockRequest();
            });
        });

        unlockBtn.addEventListener('click', handleUnlockRequest);

        function handleUnlockRequest() {
            if (isLockout) return;
            if (p1.value === _O.k1 && p2.value === _O.k2) {
                runDecryptionSequence();
            } else {
                handleFailure();
            }
        }

        function handleFailure() {
            failedAttempts++;
            statusMsg.classList.remove('hidden');
            statusMsg.classList.add('text-red-500', 'border-red-500/20');
            
            if (failedAttempts >= 3) {
                isLockout = true;
                let countdown = 60;
                document.getElementById('login-panel').classList.add('lockout-active');
                const timer = setInterval(() => {
                    statusMsg.innerText = `SECURITY LOCKOUT: ${countdown}s`;
                    countdown--;
                    if (countdown < 0) {
                        clearInterval(timer);
                        location.reload();
                    }
                }, 1000);
            } else {
                statusMsg.innerText = `INVALID SIGNATURE - ATTEMPT ${failedAttempts}/3`;
                p2.value = "";
                p2.focus();
                // Shake effect
                const panel = document.getElementById('login-panel');
                panel.classList.add('translate-x-2');
                setTimeout(() => panel.classList.remove('translate-x-2'), 100);
            }
        }

        function runDecryptionSequence() {
            document.getElementById('auth-forms').classList.add('hidden');
            document.getElementById('loading-ui').classList.remove('hidden');
            lockIcon.className = "fas fa-unlock text-3xl text-green-400 animate-pulse";
            
            let progress = 0;
            const bar = document.getElementById('decrypt-bar');
            const status = document.getElementById('decrypt-status');
            const log = document.getElementById('decrypt-log');
            
            const messages = [
                "Allocating Virtual Memory...",
                "Running RSA-4096 Decryption...",
                "Bypassing Firewall Clusters...",
                "Verifying Identity Shards...",
                "Handshake Finalized."
            ];

            const interval = setInterval(() => {
                progress += Math.random() * 12;
                if (progress > 100) progress = 100;
                bar.style.width = `${progress}%`;
                
                status.innerText = messages[Math.floor((progress/101) * messages.length)];
                log.innerText = `0x${Math.random().toString(16).slice(2, 10).toUpperCase()} >> SYNC_OK`;

                if (progress === 100) {
                    clearInterval(interval);
                    setTimeout(unlockVault, 400);
                }
            }, 60);
        }

        function unlockVault() {
            isAuthorized = true;
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('main-vault').classList.remove('hidden-vault');
            
            const container = document.getElementById('links-container');
            // Security: Data is only injected now, after auth is successful
            RAW_VAULT.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = "glass-card rounded-3xl p-6 flex flex-col justify-between group hover:border-blue-500/30 transition-all duration-500 hover:-translate-y-1";

                        <h3 class="text-lg font-black text-white mb-2 group-hover:text-blue-400 transition-colors">${item.title}</h3>

                    <div class="mt-8 flex items-center justify-between">

                        <button onclick="copyData('${item.url}', this)" class="w-12 h-12 rounded-2xl bg-slate-900/50 hover:bg-blue-600 text-slate-500 hover:text-white transition-all flex items-center justify-center border border-white/5 active:scale-90">

                    </div>
                `;
                container.appendChild(div);
            });

            startSessionTimer();
        }

        function startSessionTimer() {
            let time = totalSessionTime;
            const display = document.getElementById('timer');
            const progressBar = document.getElementById('session-progress');
            
            sessionTimer = setInterval(() => {
                const m = Math.floor(time / 60);
                const s = time % 60;
                display.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                
                const percent = (time / totalSessionTime) * 100;
                progressBar.style.width = `${100 - percent}%`;

                if (time <= 300) { // Last 5 mins
                    display.classList.add('text-red-500', 'animate-pulse');
                    progressBar.classList.add('bg-red-500');
                }

                if (time <= 0) {
                    clearInterval(sessionTimer);

                time--;
